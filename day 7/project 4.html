<!DOCTYPE html>
<html>
    <head>
        <title>Dashboard</title>
        <style>
            header{
                position: fixed;
                margin-top: 0;
                width: 100%;
                background-color: navy;
                color: white;
                text-align: center;
                padding: 15px;
            }
            .sidebar{
                position: absolute;
                margin-top: 60px;
                margin-left: 0;
                width: 180px;
                background-color: lightgrey;
                height: 400px;
                padding: 15px;
            }
            .content{
                position: relative;
                margin-top: 80px;
                margin-left:210px;
                padding: 40px;
            }
        </style>
    </head>
    <body>
        <header>
            Dashboard Header
        </header>

        <div class="sidebar">
            <p>Dashboard</p>
            <p>Users</p>
            <p>Settings</p>
        </div>

        <div class="content">
            <h2>Main Content</h2>
            <p>Dashboard information goes here.</p>
        </div>
    </body>
</html>
