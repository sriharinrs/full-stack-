<!DOCTYPE html>
<html>
    <head>
        <title>
            sticky navbar
        </title>
        <style>
            nav{
                position: fixed;
                margin-top: 0;
                background-color: blue;
                padding: 20px;
                width: 100%;
            }

            nav a{
                color: white;
                margin-right: 20px;
                text-decoration: none;
            }

            .content{
                margin-top: 150px;
                padding: 20px;
                height: 1000px;
            }
        </style>
    </head>
    <body>
        <div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

        <div class="content">
            <h2>Welcome</h2>
            
        </div>
</div>
    </body>
</html>
