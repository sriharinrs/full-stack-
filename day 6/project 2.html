<!DOCTYPE html>
<html>
    <head>

        .login{
            width: 500px;

            background-color: aqua;
            margin: 50px auto;
            text-align: center;
            border-radius: 20px;
        }
        h2{
            color: blue;
        }
        .button{
            width:70px;
            padding: 5px;
            border:none;
            border-radius: 20px;
            background-color: rgb(59, 59, 158);
            color: white;
            cursor: pointer;
            ;
       


        }
    </style>
    <body>
        <div class="login">
            <h2>Login</h2>
            <label>username</label>
            <input type="text"><br><br>
            <label>password</label>
            <input type="password"><br><br>
            <input class="button" type="submit" value="Login">
        </div>
    </body>
</html>
