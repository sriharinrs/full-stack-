<!DOCTYPE html>
<html>
    <head>
        <title>Profile card</title>
        <style>
            .card{
                width: 300px;
                 margin: 50px auto; 
                padding: 20px;
                border: 2px solid #333;
                border-radius: 10px;
                background-color: white;
                text-align: center;
            }
            h2{
                color: darkblue;
                margin-bottom: 5px;
            }

            h4{
                color: grey;
                margin-bottom: 15px;
            }
            p{
                color: #555;
                line-height:1.5;
            }

        </style>
    </head>
    <body>
        <div class="card">
            <h2>Sri</h2>
            <h4>Python full stack developer</h4>
            <p>I am learning HTML, CSS,Python, and web development.
                I enjoy creating simple websites and improving my coding skills.
            </p>
        </div>
    </body>
</html>
