<!DOCTYPE html>
<html>
    <head>
        <title>Students Registration Form</title>
    </head>
    <body>
        <h1>Students Registration Form</h1>
        <form>
            <label>First Name: </label>
            <input type="checkbox" required><br><br>
            
            <label>Last Name: </label>
            <input type="name" required><br><br>

            <label>Date of Birth: </label>
            <input type="date" required><br><br>

            <label>Age: </label>
            <input type="number" min="18" max="60" required><br><br>

            <label>Gender: </label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female<br><br>

            <label>Email: </label>
            <input type="email" required><br><br>

            <label>Phone number: </label>
            <input type="tel" required><br><br>

            <label>Password: </label>
            <input type="password" required><br><br>

            <label>Confirm Password: </label>
            <input type="password" required><br><br>

            <label>Department: </label>
            <select>
                <option>--Select Department--</option>
                <option>CSC</option>
                <option>ECE</option>
                <option>Mech</option>
                <option>Civil</option>
            </select><br><br>

            <label>Year of Study: </label>
            <select>
                <option >1st Year</option>
                <option >2nd Year</option>
                <option >3rd Year</option>
                <option >4th Year</option>
            </select><br><br>

            <label>Skills: </label>
            <input type="checkbox"> HTML
            <input type="checkbox"> CSS
            <input type="checkbox"> JAVASCRIPT
            <input type="checkbox"> PYTHON
            <input type="checkbox"> C PROGRAMMING <br><br>

            <label>Address: </label>
            <textarea rows="4" cols="30" required></textarea><br><br>

            <label>Upload Photo: </label>
            <input type="file"><br><br>

            <input type="checkbox" required>
            I agree to the terms and conditions.<br><br>

            <input type="submit" value="register">
            <input type="reset" value="reset">


        </form>
    </body>
</html>
