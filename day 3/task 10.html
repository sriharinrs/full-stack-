<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration Form</title>
    </head>
    <body>
        <h2>Student Registration Form</h2>
       <label>Name: </label>
       <input type="text" placeholder="Enter your name" required><br><br>
       <label>Email: </label>
       <input type="email" placeholder="Enter your mail" required><br><br>
       <label>Password: </label>
       <input type="password" placeholder="Enter your password" required><br><br
       <label>Age: </label>
       <input type="number" min="15" max="30" required><br><br> 
       <label>Gender</label>
       <input type="radio" name="gender" >Male
       <input type="radio" name="gender">Female
       <br><br>
        <label>Skills</label>
        <input type="checkbox">HTML
        <input type="checkbox">CSS
        <input type="checkbox">Javascript<br><br>
        <input type="submit">
    </body>
</html>
